<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>88鍵鋼琴</title>
<style>
:root{--w:34px}
@media(max-width:768px){:root{--w:26px}}
@media(max-width:420px){:root{--w:20px}}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;margin:0;padding:0}
body{background:#f8fafc;color:#0f172a;font-family:sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;background:#fff;padding:4px 8px;border-bottom:1px solid #cbd5e1;font-size:12px}
.btn{background:#e2e8f0;color:#0f172a;border:1px solid #cbd5e1;padding:3px 8px;border-radius:4px;font-size:12px;cursor:pointer}
.btn-on{background:#86efac;color:#14532d;border-color:#4ade80;font-weight:bold}
.btn-off{background:#fde047;color:#713f12;border-color:#facc15;font-weight:bold}
.btn-c4{background:#0284c7;color:#fff;border:none}
.set{display:none;background:#f1f5f9;padding:4px 8px;border-bottom:1px solid #cbd5e1;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px}
.set.open{display:flex}
.scroll{flex:1;width:100%;overflow-x:auto;overflow-y:hidden;background:#e2e8f0;padding:4px 2px 2px;-webkit-overflow-scrolling:touch}
.piano{display:flex;height:100%;width:max-content}
.key{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:6px;font-weight:700;touch-action:none}
.white{width:var(--w);height:100%;background:#fff;color:#334155;border:1px solid #cbd5e1;border-radius:0 0 5px 5px;z-index:1}
.white.active{background:#bae6fd;transform:translateY(2px)}
.black{width:calc(var(--w)*0.62);height:58%;background:#334155;color:#fff;margin:0 calc(var(--w)*-0.31);border-radius:0 0 4px 4px;z-index:2}
.black.active{background:#0284c7;transform:translateY(2px)}
.lbl{font-size:clamp(8px,calc(var(--w)*0.25),11px);pointer-events:none}
.hide .lbl{display:none}
</style>
</head>
<body>
<div class="bar">
  <div style="display:flex;gap:4px;align-items:center">
    <button id="snd" class="btn btn-off" onclick="unlock(1)">🔇啟動</button>
    <button class="btn" onclick="go('C2')">C2</button>
    <button class="btn" onclick="go('C3')">C3</button>
    <button class="btn btn-c4" onclick="go('C4')">C4</button>
    <button class="btn" onclick="go('C5')">C5</button>
    <button class="btn" onclick="go('C6')">C6</button>
  </div>
  <button class="btn" onclick="document.getElementById('set').classList.toggle('open')">⚙️</button>
</div>
<div class="set" id="set">
  <label>音<input type="range" id="vol" min="0.2" max="1.5" step="0.1" value="1" style="width:60px"></label>
  <label>延<input type="range" id="sus" min="0.5" max="4" step="0.1" value="1.8" style="width:60px"></label>
  <label>寬<input type="range" min="16" max="50" value="34" oninput="document.documentElement.style.setProperty('--w',this.value+'px')" style="width:60px"></label>
  <label><input type="checkbox" checked onchange="p.classList.toggle('hide',!this.checked)">字</label>
</div>
<div class="scroll"><div class="piano" id="p"></div></div>
<script>
let ctx=null;const p=document.getElementById('p'),els={};
function init(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();if(ctx.state==='running'){const b=document.getElementById('snd');b.className='btn btn-on';b.textContent='🔊有聲'}}
function unlock(t){init();const s=ctx.createBufferSource();s.buffer=ctx.createBuffer(1,1,22050);s.connect(ctx.destination);s.start(0);if(t)play(523.25)}
['touchstart','pointerdown','click'].forEach(e=>window.addEventListener(e,()=>unlock(0),{passive:true}));
const ns=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
for(let m=21;m<=108;m++){
  const n=ns[m%12]+(Math.floor(m/12)-1),blk=n.includes('#'),f=440*Math.pow(2,(m-69)/12),d=document.createElement('div');
  d.className='key '+(blk?'black':'white');d.innerHTML=`<span class="lbl">${n}</span>`;
  d.addEventListener('pointerdown',e=>{e.preventDefault();unlock(0);play(f);d.classList.add('active')});
  const rel=()=>d.classList.remove('active');
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>d.addEventListener(ev,rel));
  p.appendChild(d);els[n]=d;
}
function play(f){
  init();const t=ctx.currentTime,v=+document.getElementById('vol').value,s=+document.getElementById('sus').value,g=ctx.createGain();
  g.gain.setValueAtTime(0.001,t);g.gain.linearRampToValueAtTime(v*0.45,t+0.015);g.gain.exponentialRampToValueAtTime(0.0008,t+s);g.connect(ctx.destination);
  [[1,'triangle',0.7],[2,'sine',0.25],[3,'sine',0.1]].forEach(([r,w,gn])=>{
    const o=ctx.createOscillator(),hg=ctx.createGain();o.type=w;o.frequency.setValueAtTime(f*r,t);hg.gain.setValueAtTime(gn,t);o.connect(hg);hg.connect(g);o.start(t);o.stop(t+s);
  });
}
function go(n){els[n]?.scrollIntoView({behavior:'smooth',inline:'center'})}
window.onload=()=>setTimeout(()=>go('C4'),100);
</script>
</body>
</html>
